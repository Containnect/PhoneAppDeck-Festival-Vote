<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eff6ff">
  <title>文化祭人気投票</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;color:#15233b;background:#f4f7fb}
    *{box-sizing:border-box}body{margin:0;padding:22px 14px}main{max-width:520px;margin:auto}
    header{text-align:center;margin:14px 0 24px}h1{font-size:1.65rem;margin:.4em 0}p{line-height:1.6}
    .panel{background:white;border:1px solid #dce5f0;border-radius:18px;padding:20px;box-shadow:0 5px 20px #1327460d}
    .choices{display:grid;gap:12px;margin:18px 0}button{font:inherit;border-radius:12px;border:1px solid #cbd5e1;padding:14px;cursor:pointer;background:white;color:#15233b}
    button:focus-visible{outline:3px solid #1762d4;outline-offset:2px}button:disabled{opacity:.65;cursor:not-allowed}
    .choice{text-align:left;font-weight:650}.choice:hover:not(:disabled){background:#eff6ff}
    .primary{background:#1456c7;color:white;border-color:#1456c7;width:100%}
    .muted{color:#53647c;font-size:.92rem}.notice{border-left:4px solid #d59a20;padding:10px 12px;background:#fff8e7;border-radius:6px}
    #result{margin-top:16px}#message{min-height:1.5em;font-weight:600}meter{width:100%;height:18px}
    .result-row{margin:12px 0}.result-label{display:flex;justify-content:space-between;gap:8px}
  </style>
</head>
<body>
<main>
  <header><span aria-hidden="true">🎪</span><h1>文化祭人気投票</h1><p>どの企画が気になる？</p></header>
  <section class="panel" aria-labelledby="question">
    <h2 id="question">気になる企画を1つ選ぼう</h2>
    <p class="muted">この端末で1票を投じられます。</p>
    <div id="choices" class="choices"></div>
    <p id="message" role="status" aria-live="polite"></p>
    <div id="result" aria-live="polite"></div>
    <button id="reset" type="button">投票をやり直す</button>
  </section>
  <p class="notice">このアプリは練習用です。投票はこのブラウザ内だけに保存され、ほかの人の票は集計されません。</p>
</main>
<script>
(() => {
  'use strict';
  const options = ['お化け屋敷', 'カフェ', 'ステージ発表'];
  const key = 'pad-education-festival-vote-v1';
  const choices = document.getElementById('choices');
  const message = document.getElementById('message');
  const result = document.getElementById('result');
  const reset = document.getElementById('reset');
  const readVote = () => {
    try { const value = localStorage.getItem(key); return options.includes(value) ? value : null; }
    catch { return null; }
  };
  const saveVote = value => {
    try { localStorage.setItem(key, value); return true; }
    catch { return false; }
  };
  const clearVote = () => { try { localStorage.removeItem(key); } catch {} };
  let voted = readVote();
  const render = () => {
    choices.replaceChildren();
    for (const option of options) {
      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'choice';
      button.textContent = option;
      button.disabled = voted !== null;
      button.setAttribute('aria-pressed', String(voted === option));
      button.addEventListener('click', () => {
        if (voted !== null) return;
        voted = option;
        const stored = saveVote(option);
        render();
        if (!stored) message.textContent = '投票は表示されますが、この環境では保存できません。';
      });
      choices.append(button);
    }
    message.textContent = voted ? 'あなたの選択：' + voted : 'まだ投票していません。';
    result.replaceChildren();
    if (!voted) return;
    const heading = document.createElement('h3');
    heading.textContent = 'この端末の投票結果';
    result.append(heading);
    for (const option of options) {
      const row = document.createElement('div');
      row.className = 'result-row';
      const label = document.createElement('div');
      label.className = 'result-label';
      const name = document.createElement('span');
      name.textContent = option;
      const count = document.createElement('span');
      count.textContent = option === voted ? '1票' : '0票';
      label.append(name, count);
      const bar = document.createElement('meter');
      bar.min = 0; bar.max = 1; bar.value = option === voted ? 1 : 0;
      bar.setAttribute('aria-label', option + 'の票数');
      row.append(label, bar);
      result.append(row);
    }
  };
  reset.addEventListener('click', () => { clearVote(); voted = null; render(); });
  render();
})();
</script>
</body>
</html>
